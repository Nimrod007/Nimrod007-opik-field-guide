[project]
name = "langgraph-boardgame-rules-rag"
version = "0.1.0"
description = "Rules-lawyer RAG over three invented board games, built with LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "numpy>=2.0",
    "opik>=2.2.99",
    "python-dotenv>=1.0",
]

[project.scripts]
rulesrag = "rulesrag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rulesrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
