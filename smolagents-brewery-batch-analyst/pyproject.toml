[project]
name = "smolagents-brewery-batch-analyst"
version = "0.1.0"
description = "smolagents CodeAgent that answers questions about a brewery's fermentation batch log by writing pandas code"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "smolagents>=1.20",
]

[dependency-groups]
dev = ["pytest>=8"]
