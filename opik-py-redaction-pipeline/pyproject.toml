[project]
name = "opik-py-redaction-pipeline"
version = "0.1.0"
description = "A PII redaction pipeline traced by hand with the low-level Opik client"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik==2.2.99",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
