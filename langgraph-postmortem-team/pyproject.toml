[project]
name = "langgraph-postmortem-team"
version = "0.1.0"
description = "A planner, three investigators and a writer in LangGraph that draft an incident post-mortem, traced as one deep Opik trace"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "opik>=2.2.99",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postmortem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
