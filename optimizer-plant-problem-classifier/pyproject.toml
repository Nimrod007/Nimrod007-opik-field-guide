[project]
name = "optimizer-plant-problem-classifier"
version = "0.1.0"
description = "A weak plant-problem classifier prompt, improved by an optimizer against a small labeled set"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik==2.2.99",
    "opik-optimizer==3.2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
