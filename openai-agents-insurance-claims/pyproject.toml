[project]
name = "openai-agents-insurance-claims"
version = "0.1.0"
description = "Home-insurance claims triage with OpenAI Agents SDK handoffs, traced in Opik"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.22.0",
    "opik>=2.2.35",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
