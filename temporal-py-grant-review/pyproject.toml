[project]
name = "temporal-py-grant-review"
version = "0.1.0"
description = "Durable community-grant review on Temporal, traced end to end with Opik across two processes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opik>=2.2.31",
    "openai>=1.60",
    "temporalio>=1.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
