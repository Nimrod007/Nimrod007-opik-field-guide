[project]
name = "ollama-ham-radio-rag"
version = "0.1.0"
description = "Fully local RAG over an amateur-radio operating handbook with Ollama and LangChain"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "numpy>=2.0",
    "opik>=2.2.99",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
